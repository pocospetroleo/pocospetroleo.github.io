<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estúdio de Fotos • Modo Criador</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101018;color:#f5f5fb}header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1b1b27;gap:12px}a{color:#c9b8ff;text-decoration:none}h1{font-size:18px;margin:0}main{max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.preview{min-height:340px;background:#20202c;border:1px solid #383848;border-radius:18px;display:grid;place-items:center;overflow:hidden;padding:16px}canvas{max-width:100%;max-height:65vh;object-fit:contain}aside{background:#1c1c29;border-radius:18px;padding:18px}.controls{display:grid;gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:650}label span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#9874ff}button,.btn{border:0;border-radius:11px;background:#6946df;color:white;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#343447}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.buttons button{flex:1}input[type=file]{max-width:100%}small{color:#b7b5c9}#status{min-height:20px;color:#c9b8ff} @media(max-width:720px){main{grid-template-columns:1fr}.preview{min-height:260px}canvas{max-height:48vh}}</style></head><body>
<header><a href="./">← Modo Criador</a><a href="estetica-pro.html">Estética corporal e facial</a><h1>Estúdio de Fotos</h1><button id="export">Exportar JPG</button></header>
<main><section><div class="preview"><canvas id="canvas" aria-label="Prévia da foto editada"></canvas><p id="empty">Escolha uma foto para começar</p></div><div class="buttons"><input id="file" type="file" accept="image/*" aria-label="Escolher foto"></div><div class="buttons"><button class="secondary" id="rotate">Girar 90°</button><button class="secondary" id="flip">Espelhar</button><button class="secondary" id="reset">Restaurar</button></div><p id="status" role="status"></p><small>Alterações aplicadas à prévia em tempo real. A foto original permanece intacta.</small></section><aside><h2>Ajustes profissionais</h2><div class="controls" id="controls"></div><div class="buttons"><button class="secondary" id="undo">Desfazer</button><button class="secondary" id="redo">Refazer</button></div></aside></main>
<script>
const defs=[['brilho','Brilho',-100,100,0],['contraste','Contraste',-100,100,0],['saturacao','Saturação',-100,100,0],['temperatura','Temperatura',-100,100,0],['exposicao','Exposição',-100,100,0],['cinza','Preto e branco',0,100,0],['sepia','Sépia',0,100,0],['desfoque','Desfoque',0,12,0]];
const state=Object.fromEntries(defs.map(d=>[d[0],d[4]]));state.rot=0;state.flip=false;
let original=null,history=[],future=[],renderQueued=false;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
const controls=document.getElementById('controls');defs.forEach(([key,title,min,max,def])=>{let label=document.createElement('label');label.innerHTML='<span>'+title+' <output id="out-'+key+'">0</output></span>';let input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=def;input.id='adj-'+key;input.addEventListener('pointerdown',()=>checkpoint(),{passive:true});input.addEventListener('keydown',e=>{if(!e.repeat)checkpoint()});input.addEventListener('input',()=>{state[key]=Number(input.value);document.getElementById('out-'+key).textContent=input.value;queueRender()});label.append(input);controls.append(label)});
function checkpoint(){history.push({...state});if(history.length>50)history.shift();future=[]}
function restore(s){Object.assign(state,s);defs.forEach(d=>{document.getElementById('adj-'+d[0]).value=state[d[0]];document.getElementById('out-'+d[0]).textContent=state[d[0]]});queueRender()}
function queueRender(){if(!renderQueued){renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}}
function render(){if(!original)return;let w=original.naturalWidth,h=original.naturalHeight,turn=state.rot%180!==0;const scale=Math.min(1,3000/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);canvas.width=turn?h:w;canvas.height=turn?w:h;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(state.rot*Math.PI/180);ctx.scale(state.flip?-1:1,1);
const brightness=100+state.brilho+state.exposicao*.75;const contrast=100+state.contraste;const saturation=100+state.saturacao;
ctx.filter='brightness('+Math.max(0,brightness)+'%) contrast('+Math.max(0,contrast)+'%) saturate('+Math.max(0,saturation)+'%) grayscale('+state.cinza+'%) sepia('+state.sepia+'%) blur('+state.desfoque+'px)';
ctx.drawImage(original,-w/2,-h/2,w,h);ctx.filter='none';if(state.temperatura!==0){ctx.globalCompositeOperation='soft-light';ctx.fillStyle=state.temperatura>0?'#ff9b32':'#4e92ff';ctx.globalAlpha=Math.abs(state.temperatura)/180;ctx.fillRect(-w/2,-h/2,w,h)}ctx.restore()}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent='Selecione uma imagem válida.';return}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{original=im;restore(Object.fromEntries([...defs.map(d=>[d[0],d[4]]),['rot',0],['flip',false]]));history=[];future=[];document.getElementById('empty').hidden=true;status.textContent='Foto carregada. Ajuste os controles.';URL.revokeObjectURL(url)};im.onerror=()=>{status.textContent='Não foi possível abrir este formato de imagem.';URL.revokeObjectURL(url)};im.src=url});
document.getElementById('rotate').onclick=()=>{if(!original)return;checkpoint();state.rot=(state.rot+90)%360;queueRender()};
document.getElementById('flip').onclick=()=>{if(!original)return;checkpoint();state.flip=!state.flip;queueRender()};
document.getElementById('reset').onclick=()=>{if(!original)return;checkpoint();restore(Object.fromEntries([...defs.map(d=>[d[0],d[4]]),['rot',0],['flip',false]]))};
document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push({...state});restore(history.pop())};
document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push({...state});restore(future.pop())};
document.getElementById('export').onclick=()=>{if(!original){status.textContent='Escolha uma foto antes de exportar.';return}canvas.toBlob(blob=>{if(!blob){status.textContent='Falha ao exportar.';return}let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='modo-criador-editado.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);status.textContent='Exportação iniciada.'},'image/jpeg',.94)};
</script></body></html>
