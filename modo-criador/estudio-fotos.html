<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estúdio de Fotos • Modo Criador</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101018;color:#f5f5fb}header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#1b1b27;gap:12px}a{color:#c9b8ff;text-decoration:none}h1{font-size:18px;margin:0}main{max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.preview{min-height:340px;background:#20202c;border:1px solid #383848;border-radius:18px;display:grid;place-items:center;overflow:hidden;padding:16px}canvas{max-width:100%;max-height:65vh;object-fit:contain}aside{background:#1c1c29;border-radius:18px;padding:18px}.controls{display:grid;gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:650}label span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#9874ff}button,.btn{border:0;border-radius:11px;background:#6946df;color:white;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#343447}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.buttons button{flex:1}input[type=file]{max-width:100%}small{color:#b7b5c9}#status{min-height:20px;color:#c9b8ff} @media(max-width:720px){main{grid-template-columns:1fr}.preview{min-height:260px}canvas{max-height:48vh}}header{position:sticky;top:0;z-index:20;flex-wrap:wrap}header h1{font-size:15px}header a{font-size:12px}main{align-items:start}main>section{position:sticky;top:65px;z-index:10;background:#101018;padding-bottom:8px}.preview{min-height:0;height:min(48vh,430px);padding:8px;display:flex;align-items:center;justify-content:center}.preview canvas{display:block;max-height:100%;max-width:100%;width:auto;height:auto}.preview canvas:not([width]),.preview canvas[width="300"]{visibility:hidden}.preview p{position:absolute}.controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.controls label{background:#252536;border-radius:12px;padding:10px;min-width:0}aside{padding:12px}aside h2{font-size:16px;margin:4px 0 12px}.buttons{margin:7px 0}button{padding:9px 11px}#status{font-size:13px;margin:5px 0}@media(max-width:720px){header{padding:8px 12px}main{padding:8px;gap:8px;display:block}main>section{top:55px;padding:4px 0 7px;box-shadow:0 7px 18px #101018}.preview{height:34vh;min-height:175px;max-height:330px}.preview canvas{max-height:100%}.controls{gap:8px}aside{border-radius:12px}.controls label{font-size:12px;padding:8px}.buttons button{font-size:12px}.buttons input{font-size:12px}}@media(max-width:390px){.preview{height:29vh}header h1{display:none}} .preview{position:relative;touch-action:none;overflow:hidden;user-select:none}.preview canvas{transform-origin:center center;transition:transform .06s linear;flex-shrink:0}.zoom-toolbar{display:flex;gap:6px;align-items:center;justify-content:center;margin:4px 0}.zoom-toolbar button{min-width:45px}.zoom-toolbar output{min-width:48px;text-align:center;font-size:13px}.preview p{pointer-events:none}.preview canvas{visibility:visible!important}@media(max-width:720px){main>section{position:relative;top:auto;box-shadow:none}.preview{height:48vh;min-height:270px;max-height:520px}aside{position:relative}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}header{position:relative}}</style></head><body>
<header><a href="./">← Modo Criador</a><a href="estetica-pro.html">Estética corporal e facial</a><h1>Estúdio de Fotos</h1><button id="export">Exportar JPG</button></header>
<main><section><div class="preview"><canvas id="canvas" aria-label="Prévia da foto editada"></canvas><p id="empty">Escolha uma foto para começar</p></div><div class="zoom-toolbar"><button class="secondary" id="zoom-out" type="button">−</button><output id="zoom-level">100%</output><button class="secondary" id="zoom-in" type="button">+</button><button class="secondary" id="zoom-fit" type="button">Enquadrar</button></div><div class="buttons"><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" aria-label="Escolher foto"></div><div class="buttons"><button class="secondary" id="rotate">Girar 90°</button><button class="secondary" id="flip">Espelhar</button><button class="secondary" id="reset">Restaurar</button></div><p id="status" role="status"></p><small>Alterações aplicadas à prévia em tempo real. A foto original permanece intacta.</small></section><aside><h2>Ajustes profissionais</h2><div class="controls" id="controls"></div><div class="buttons"><button class="secondary" id="undo">Desfazer</button><button class="secondary" id="redo">Refazer</button></div></aside></main>
<script>
const defs=[['brilho','Brilho',-100,100,0],['contraste','Contraste',-100,100,0],['saturacao','Saturação',-100,100,0],['temperatura','Temperatura',-100,100,0],['exposicao','Exposição',-100,100,0],['cinza','Preto e branco',0,100,0],['sepia','Sépia',0,100,0],['desfoque','Desfoque',0,12,0]];
const state=Object.fromEntries(defs.map(d=>[d[0],d[4]]));state.rot=0;state.flip=false;
let original=null,history=[],future=[],renderQueued=false,zoom=1,panX=0,panY=0;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
const preview=document.querySelector('.preview');function updateZoom(){canvas.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';document.getElementById('zoom-level').textContent=Math.round(zoom*100)+'%'}function setZoom(z){zoom=Math.max(1,Math.min(6,z));if(zoom===1){panX=0;panY=0}updateZoom()}document.getElementById('zoom-in').onclick=()=>setZoom(zoom*1.3);document.getElementById('zoom-out').onclick=()=>setZoom(zoom/1.3);document.getElementById('zoom-fit').onclick=()=>setZoom(1);const touches=new Map();let lastDistance=0,lastMid=null;preview.addEventListener('pointerdown',e=>{if(!original)return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});preview.setPointerCapture(e.pointerId)});preview.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1&&zoom>1){panX+=e.clientX-prev.x;panY+=e.clientY-prev.y;updateZoom()}else if(touches.size===2){const pts=[...touches.values()];const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};if(lastDistance)setZoom(zoom*d/lastDistance);if(lastMid){panX+=mid.x-lastMid.x;panY+=mid.y-lastMid.y;updateZoom()}lastDistance=d;lastMid=mid}});function clearPointer(e){touches.delete(e.pointerId);lastDistance=0;lastMid=null}preview.addEventListener('pointerup',clearPointer);preview.addEventListener('pointercancel',clearPointer);preview.addEventListener('wheel',e=>{if(!original)return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.12:1/1.12))},{passive:false});const controls=document.getElementById('controls');defs.forEach(([key,title,min,max,def])=>{let label=document.createElement('label');label.innerHTML='<span>'+title+' <output id="out-'+key+'">0</output></span>';let input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=def;input.id='adj-'+key;input.addEventListener('pointerdown',()=>checkpoint(),{passive:true});input.addEventListener('keydown',e=>{if(!e.repeat)checkpoint()});input.addEventListener('input',()=>{state[key]=Number(input.value);document.getElementById('out-'+key).textContent=input.value;queueRender()});label.append(input);controls.append(label)});
function checkpoint(){history.push({...state});if(history.length>50)history.shift();future=[]}
function restore(s){Object.assign(state,s);defs.forEach(d=>{document.getElementById('adj-'+d[0]).value=state[d[0]];document.getElementById('out-'+d[0]).textContent=state[d[0]]});queueRender()}
function queueRender(){if(!renderQueued){renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}}
function render(){if(!original)return;let w=original.naturalWidth,h=original.naturalHeight,turn=state.rot%180!==0;if(!w||!h){status.textContent='A imagem não possui dimensões válidas.';return}const scale=Math.min(1,2200/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);canvas.width=turn?h:w;canvas.height=turn?w:h;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(state.rot*Math.PI/180);ctx.scale(state.flip?-1:1,1);
const brightness=100+state.brilho+state.exposicao*.75;const contrast=100+state.contraste;const saturation=100+state.saturacao;
ctx.filter='brightness('+Math.max(0,brightness)+'%) contrast('+Math.max(0,contrast)+'%) saturate('+Math.max(0,saturation)+'%) grayscale('+state.cinza+'%) sepia('+state.sepia+'%) blur('+state.desfoque+'px)';
try{ctx.drawImage(original,-w/2,-h/2,w,h)}catch(e){status.textContent='Falha ao renderizar a imagem. Experimente JPG ou PNG.';ctx.restore();return}ctx.filter='none';if(state.temperatura!==0){ctx.globalCompositeOperation='soft-light';ctx.fillStyle=state.temperatura>0?'#ff9b32':'#4e92ff';ctx.globalAlpha=Math.abs(state.temperatura)/180;ctx.fillRect(-w/2,-h/2,w,h)}ctx.restore()}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(/\.(dng|raw|cr2|nef|arw|raf|orf)$/i.test(f.name)){status.textContent='Arquivo RAW/DNG não suportado neste editor. Exporte a foto em JPG ou PNG no app Fotos e selecione novamente.';original=null;document.getElementById('empty').hidden=false;return}if(!f.type.startsWith('image/')&&!/\.(jpg|jpeg|png|webp|heic|heif)$/i.test(f.name)){status.textContent='Selecione uma foto JPG, PNG ou HEIC compatível.';return}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{if(!im.naturalWidth||!im.naturalHeight){status.textContent='A foto não pôde ser decodificada.';URL.revokeObjectURL(url);return}original=im;setZoom(1);restore(Object.fromEntries([...defs.map(d=>[d[0],d[4]]),['rot',0],['flip',false]]));history=[];future=[];document.getElementById('empty').hidden=true;status.textContent='Prévia pronta. Ajuste os controles abaixo.';URL.revokeObjectURL(url)};im.onerror=()=>{status.textContent='Não foi possível abrir este formato de imagem.';URL.revokeObjectURL(url)};im.src=url});
document.getElementById('rotate').onclick=()=>{if(!original)return;checkpoint();state.rot=(state.rot+90)%360;queueRender()};
document.getElementById('flip').onclick=()=>{if(!original)return;checkpoint();state.flip=!state.flip;queueRender()};
document.getElementById('reset').onclick=()=>{if(!original)return;checkpoint();restore(Object.fromEntries([...defs.map(d=>[d[0],d[4]]),['rot',0],['flip',false]]))};
document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push({...state});restore(history.pop())};
document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push({...state});restore(future.pop())};
document.getElementById('export').onclick=()=>{if(!original){status.textContent='Escolha uma foto antes de exportar.';return}canvas.toBlob(blob=>{if(!blob){status.textContent='Falha ao exportar.';return}let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='modo-criador-editado.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);status.textContent='Exportação iniciada.'},'image/jpeg',.94)};
</script></body></html>
