<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Editor Visual PRO — Modo Criador</title><style>
*{box-sizing:border-box}body{margin:0;background:#11121a;color:#fff;font:14px system-ui}header{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#202232}header strong{flex:1}a{color:#d7c6ff}button,select,input[type=color]{background:#35384d;color:#fff;border:1px solid #565974;border-radius:9px;padding:9px;font:inherit}button.primary{background:#7652e8}button.selected{background:#7652e8}main{display:grid;grid-template-columns:190px minmax(0,1fr) 245px;height:calc(100dvh - 58px)}nav,aside{padding:12px;background:#1c1e2c;overflow:auto}nav{display:flex;flex-direction:column;gap:7px}.work{display:flex;flex-direction:column;min-width:0;overflow:hidden}.viewport{flex:1;min-height:180px;position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center;background:repeating-conic-gradient(#272936 0% 25%,#1e202a 0% 50%) 50%/24px 24px}canvas{max-width:none;touch-action:none;box-shadow:0 8px 30px #0008;transform-origin:center center}.bar{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px;background:#222433}.bar output{min-width:45px;text-align:center}label{display:grid;gap:5px;margin:12px 0}input[type=range]{width:100%;accent-color:#a48aff}.layer{display:flex;gap:4px;align-items:center;margin:5px 0}.layer button:first-child{flex:1;text-align:left}small{color:#bbb9cb}#status{font-size:12px;color:#cbbcff;padding:6px 10px;min-height:26px}@media(max-width:760px){header{height:54px}main{display:flex;flex-direction:column;height:calc(100dvh - 54px)}nav{order:2;flex-direction:row;overflow-x:auto;flex-shrink:0;padding:8px}nav button{white-space:nowrap}.work{order:1;flex:1;min-height:250px}.viewport{min-height:220px}aside{order:3;max-height:31dvh;flex-shrink:0;padding:9px}.bar{padding:5px}aside h3{margin:5px 0}label{margin:7px 0}} </style></head><body><header><a href="./">← Voltar</a><strong>Editor Visual PRO</strong><button id="download" class="primary">Exportar PNG</button></header><main><nav><button id="load">+ Foto</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden><button data-tool="select" class="selected">↖ Selecionar</button><button data-tool="brush">✎ Pincel</button><button data-tool="eraser">◯ Borracha</button><button id="addText">T Texto</button><button id="addRect">▭ Forma</button><button id="addCircle">◯ Círculo</button><button id="undo">↶ Desfazer</button><button id="redo">↷ Refazer</button><button id="reset">Restaurar</button></nav><section class="work"><div class="viewport" id="viewport"><canvas id="canvas" width="900" height="900"></canvas></div><div class="bar"><button id="minus">−</button><output id="zoomLabel">100%</output><button id="plus">+</button><button id="fit">Enquadrar</button><button id="pan">Mover tela</button></div><div id="status" role="status">Adicione uma foto ou crie textos e formas.</div></section><aside><h3>Propriedades</h3><label>Cor <input type="color" id="color" value="#ffffff"></label><label>Espessura / fonte <input id="size" type="range" min="2" max="100" value="28"></label><label>Opacidade <input id="opacity" type="range" min="10" max="100" value="100"></label><div id="objectControls"><button id="editText">Editar texto</button> <button id="delete">Excluir seleção</button></div><h3>Camadas</h3><div id="layers"></div><small>Selecione e arraste objetos. Use dois dedos para aproximar e mover a tela. Arquivos RAW/DNG precisam ser convertidos para JPG ou PNG.</small></aside></main><script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),viewport=document.getElementById('viewport'),status=document.getElementById('status'),file=document.getElementById('file');let objects=[],selected=-1,tool='select',zoom=1,offsetX=0,offsetY=0,drag=null,pointers=new Map(),pinch=null,history=[],future=[],background=null,original=null;const $=id=>document.getElementById(id);
function snapshot(){return JSON.stringify({objects,selected})}function checkpoint(){history.push(snapshot());if(history.length>40)history.shift();future=[]}function restore(s){const v=JSON.parse(s);objects=v.objects;selected=v.selected;draw();layers()}
function renderObject(o){ctx.save();ctx.globalAlpha=o.opacity??1;ctx.fillStyle=o.color||'#fff';ctx.strokeStyle=o.color||'#fff';ctx.lineWidth=o.size||10;if(o.type==='text'){ctx.font='bold '+o.size+'px system-ui';ctx.textBaseline='top';ctx.fillText(o.text,o.x,o.y)}else if(o.type==='rect')ctx.fillRect(o.x,o.y,o.w,o.h);else if(o.type==='circle'){ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2),Math.abs(o.h/2),0,0,Math.PI*2);ctx.fill()}else if(o.type==='stroke'){ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();o.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.restore()}
function bounds(o){if(o.type==='text'){ctx.font='bold '+o.size+'px system-ui';return{x:o.x,y:o.y,w:ctx.measureText(o.text).width,h:o.size*1.3}}if(o.type==='stroke'){const xs=o.points.map(p=>p.x),ys=o.points.map(p=>p.y);const x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}return{x:o.x,y:o.y,w:o.w,h:o.h}}
function draw(){ctx.clearRect(0,0,c.width,c.height);if(background)ctx.drawImage(background,0,0,c.width,c.height);objects.forEach(renderObject);if(selected>=0&&objects[selected]){const b=bounds(objects[selected]);ctx.save();ctx.strokeStyle='#a884ff';ctx.lineWidth=3;ctx.setLineDash([9,6]);ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);ctx.restore()}updateTransform()}
function updateTransform(){c.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+zoom+')';$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function fit(){const scale=Math.min((viewport.clientWidth-22)/c.width,(viewport.clientHeight-22)/c.height);zoom=Math.max(.05,scale);offsetX=offsetY=0;updateTransform()}function zoomBy(f){zoom=Math.max(.05,Math.min(10,zoom*f));updateTransform()}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*c.width,y:(e.clientY-r.top)/r.height*c.height}}
function hit(p){for(let i=objects.length-1;i>=0;i--){const b=bounds(objects[i]);if(p.x>=b.x-12&&p.x<=b.x+b.w+12&&p.y>=b.y-12&&p.y<=b.y+b.h+12)return i}return -1}
function layers(){$('layers').replaceChildren();objects.forEach((o,i)=>{const row=document.createElement('div');row.className='layer';const b=document.createElement('button');b.textContent=(i===selected?'✓ ':'')+(o.type==='text'?o.text:o.type==='stroke'?'Pincel':o.type==='rect'?'Retângulo':'Círculo');b.onclick=()=>{selected=i;draw();layers()};const up=document.createElement('button');up.textContent='↑';up.onclick=()=>{if(i===objects.length-1)return;checkpoint();[objects[i],objects[i+1]]=[objects[i+1],objects[i]];selected=i+1;draw();layers()};row.append(b,up);$('layers').append(row)})}
function add(o){checkpoint();objects.push(o);selected=objects.length-1;draw();layers()}
function choose(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('selected',b.dataset.tool===t));$('pan').classList.toggle('selected',t==='pan')}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>choose(b.dataset.tool));$('pan').onclick=()=>choose(tool==='pan'?'select':'pan');
$('load').onclick=()=>file.click();file.onchange=()=>{const f=file.files[0];if(!f)return;if(/\.(dng|raw|nef|cr2|arw)$/i.test(f.name)){status.textContent='RAW/DNG não suportado: converta para JPG ou PNG.';return}const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{background=im;original=im;c.width=im.naturalWidth;c.height=im.naturalHeight;const scale=Math.min(1,2200/Math.max(c.width,c.height));c.width=Math.round(c.width*scale);c.height=Math.round(c.height*scale);objects=[];selected=-1;history=[];future=[];draw();fit();layers();status.textContent='Foto carregada. Toque em Texto, Forma ou Pincel para editar.';URL.revokeObjectURL(url)};im.onerror=()=>{status.textContent='Não foi possível abrir este formato de foto.';URL.revokeObjectURL(url)};im.src=url};
$('addText').onclick=()=>{const text=prompt('Digite o texto:','Seu texto aqui');if(text)add({type:'text',text,x:c.width*.1,y:c.height*.2,size:Number($('size').value)*2,color:$('color').value,opacity:Number($('opacity').value)/100})};
$('addRect').onclick=()=>add({type:'rect',x:c.width*.25,y:c.height*.25,w:c.width*.3,h:c.height*.18,size:5,color:$('color').value,opacity:Number($('opacity').value)/100});
$('addCircle').onclick=()=>add({type:'circle',x:c.width*.25,y:c.height*.25,w:c.width*.3,h:c.height*.3,size:5,color:$('color').value,opacity:Number($('opacity').value)/100});
$('editText').onclick=()=>{const o=objects[selected];if(!o||o.type!=='text')return;const v=prompt('Editar texto:',o.text);if(v!==null){checkpoint();o.text=v;draw();layers()}};
$('delete').onclick=()=>{if(selected<0)return;checkpoint();objects.splice(selected,1);selected=-1;draw();layers()};
$('color').oninput=()=>{if(selected<0)return;objects[selected].color=$('color').value;draw()};$('size').oninput=()=>{if(selected<0)return;objects[selected].size=Number($('size').value)*(objects[selected].type==='text'?2:1);draw()};$('opacity').oninput=()=>{if(selected<0)return;objects[selected].opacity=Number($('opacity').value)/100;draw()};
$('undo').onclick=()=>{if(!history.length)return;future.push(snapshot());restore(history.pop())};$('redo').onclick=()=>{if(!future.length)return;history.push(snapshot());restore(future.pop())};$('reset').onclick=()=>{checkpoint();objects=[];selected=-1;draw();layers()};
$('plus').onclick=()=>zoomBy(1.3);$('minus').onclick=()=>zoomBy(1/1.3);$('fit').onclick=fit;
function moveObj(o,dx,dy){if(o.type==='stroke')o.points.forEach(p=>{p.x+=dx;p.y+=dy});else{o.x+=dx;o.y+=dy}}
viewport.addEventListener('pointerdown',e=>{if(e.target!==c)return;const p=point(e);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);if(pointers.size>1){drag=null;return}if(tool==='pan'){drag={kind:'pan',x:e.clientX,y:e.clientY};return}if(tool==='brush'||tool==='eraser'){checkpoint();const o={type:'stroke',points:[p],size:Number($('size').value),color:tool==='eraser'?'#11121a':$('color').value,opacity:Number($('opacity').value)/100};objects.push(o);selected=objects.length-1;drag={kind:'draw'};draw();return}selected=hit(p);if(selected>=0){checkpoint();drag={kind:'object',point:p}}else drag=null;draw();layers()});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};if(pinch){zoom=Math.max(.05,Math.min(10,zoom*d/pinch.d));offsetX+=mid.x-pinch.mid.x;offsetY+=mid.y-pinch.mid.y;updateTransform()}pinch={d,mid};return}if(!drag)return;const p=point(e);if(drag.kind==='pan'){offsetX+=e.clientX-drag.x;offsetY+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;updateTransform()}else if(drag.kind==='draw'){objects[selected].points.push(p);draw()}else if(drag.kind==='object'&&selected>=0){moveObj(objects[selected],p.x-drag.point.x,p.y-drag.point.y);drag.point=p;draw()}});
function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){drag=null;layers()}}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);viewport.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1)},{passive:false});
$('download').onclick=()=>{const saved=selected;selected=-1;draw();c.toBlob(b=>{selected=saved;draw();if(!b){status.textContent='Falha ao exportar.';return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='modo-criador-visual.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)},'image/png')};
draw();requestAnimationFrame(fit);
</script></body></html>
