<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vídeo PRO • Modo Criador</title><style>*{box-sizing:border-box}body{margin:0;background:#11121c;color:white;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#202132;padding:14px}a{color:#cbbaff}main{max-width:850px;margin:auto;padding:14px}video{display:block;width:100%;max-height:52vh;background:#000;border-radius:16px;object-fit:contain}.panel{background:#202132;border-radius:16px;padding:15px;margin-top:12px}button{background:#6b4be2;color:white;border:0;border-radius:10px;padding:11px 14px;font:600 14px system-ui}input[type=range]{width:100%;accent-color:#9d7cff}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}label{display:block;margin:12px 0}small{color:#bbb8d0}#status{color:#cbbaff}input[type=file]{max-width:100%}</style></head><body><header><a href="./">← Modo Criador</a><strong>Vídeo PRO</strong></header><main><video id="video" playsinline controls></video><section class="panel"><input id="file" type="file" accept="video/*"><p id="status" role="status">Selecione um vídeo para começar.</p><div class="row"><button id="play">Reproduzir / Pausar</button><button id="start">Marcar início</button><button id="end">Marcar fim</button></div><label>Posição do vídeo <output id="position">00:00</output><input type="range" id="seek" min="0" max="1000" value="0"></label><div class="row"><label>Início (s)<input id="from" type="number" min="0" value="0" step=".1" style="width:100%;padding:9px"></label><label>Fim (s)<input id="to" type="number" min="0" value="0" step=".1" style="width:100%;padding:9px"></label></div><button id="preview">Visualizar trecho</button><p><small>Ferramentas de corte e prévia. A exportação processada de vídeo ainda não está disponível nesta versão; o editor não altera o arquivo original.</small></p></section></main><script>
const v=document.getElementById('video'),file=document.getElementById('file'),seek=document.getElementById('seek'),from=document.getElementById('from'),to=document.getElementById('to'),status=document.getElementById('status');let url=null,segment=false;function fmt(s){if(!Number.isFinite(s))return '00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
file.onchange=()=>{const f=file.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.load();status.textContent='Carregando vídeo…'};v.onloadedmetadata=()=>{if(!Number.isFinite(v.duration)){status.textContent='Não foi possível determinar a duração deste vídeo.';return}from.value=0;to.value=v.duration.toFixed(1);status.textContent='Vídeo carregado. Marque o início e o fim do trecho.'};v.onerror=()=>status.textContent='Formato ou codec de vídeo não suportado pelo navegador.';v.ontimeupdate=()=>{if(Number.isFinite(v.duration)&&v.duration>0)seek.value=Math.round(v.currentTime/v.duration*1000);document.getElementById('position').textContent=fmt(v.currentTime);if(segment&&v.currentTime>=Number(to.value)){v.pause();segment=false}};seek.oninput=()=>{if(Number.isFinite(v.duration))v.currentTime=Number(seek.value)/1000*v.duration};document.getElementById('play').onclick=()=>{if(!v.src)return;segment=false;v.paused?v.play().catch(()=>status.textContent='Reprodução bloqueada pelo navegador.'):v.pause()};document.getElementById('start').onclick=()=>from.value=v.currentTime.toFixed(1);document.getElementById('end').onclick=()=>to.value=v.currentTime.toFixed(1);document.getElementById('preview').onclick=()=>{const a=Number(from.value),b=Number(to.value);if(!v.src||!Number.isFinite(v.duration)||a<0||b<=a||b>v.duration){status.textContent='Selecione um intervalo válido.';return}segment=true;v.currentTime=a;v.play().catch(()=>status.textContent='Não foi possível reproduzir o trecho.')};
</script></body></html>
