<!doctype html><html lang="pt-BR" data-access-app="nasmidias"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6C3BFF"><title>Modo Criador</title> <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Pacifico&family=Bebas+Neue&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css?v=mc3"><link rel="stylesheet" href="gate.css?v=mc1"><link rel="icon" type="image/svg+xml" href="assets/modo-criador.svg?v=2"></head><body> <div class="bg-shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i></div> <div id="app"></div> <div id="toast" role="status" aria-live="polite"></div> <script type="module" src="gate.js?v=mc5"></script><div id="mc-edit-launch" style="position:fixed;right:12px;bottom:100px;z-index:9999;display:flex;gap:7px;flex-direction:column;align-items:flex-end"><button type="button" id="mc-open-visual" style="background:#9c46d8;color:white;border:0;padding:12px 15px;border-radius:30px;font:700 14px system-ui;box-shadow:0 6px 22px #0005">✦ Editor Visual PRO</button><button type="button" id="mc-open-photo" style="background:#6946df;color:#fff;border:0;padding:12px 15px;border-radius:30px;font:700 14px system-ui;box-shadow:0 6px 22px #0005">✦ Editar foto PRO</button><button type="button" id="mc-open-video" style="background:#176d79;color:#fff;border:0;padding:12px 15px;border-radius:30px;font:700 14px system-ui;box-shadow:0 6px 22px #0005">▶ Editar vídeo PRO</button><button type="button" id="mc-open-body" style="background:#242032;color:#fff;border:1px solid #9b7eff;padding:12px 15px;border-radius:30px;font:700 14px system-ui;box-shadow:0 6px 22px #0005">✦ Estética corporal</button></div><div id="mc-editor-modal" role="dialog" aria-modal="true" aria-label="Editor de imagens" hidden style="position:fixed;inset:0;z-index:10000;background:#11111c;display:none;flex-direction:column"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#202033;color:white;font:700 15px system-ui"><span id="mc-editor-title">Editor de fotos</span><button type="button" id="mc-editor-close" style="border:0;border-radius:10px;background:#6946df;color:white;padding:10px 15px;font:700 14px system-ui">Fechar ✕</button></div><iframe id="mc-editor-frame" title="Editor de imagens do Modo Criador" style="flex:1;width:100%;border:0;background:#11111c" loading="lazy"></iframe></div><script>(function(){const modal=document.getElementById('mc-editor-modal'),frame=document.getElementById('mc-editor-frame'),title=document.getElementById('mc-editor-title');function open(path,name){title.textContent=name;frame.src=path;modal.hidden=false;modal.style.display='flex';document.body.style.overflow='hidden'}function close(){modal.style.display='none';modal.hidden=true;frame.src='about:blank';document.body.style.overflow=''}document.getElementById('mc-open-visual').addEventListener('click',()=>open('editor-visual.html','Editor Visual PRO'));document.getElementById('mc-open-photo').addEventListener('click',()=>open('estudio-fotos.html','Estúdio de Fotos PRO'));document.getElementById('mc-open-video').addEventListener('click',()=>open('video-pro.html','Vídeo PRO'));document.getElementById('mc-open-body').addEventListener('click',()=>open('estetica-pro.html','Estética Corporal e Facial'));document.getElementById('mc-editor-close').addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()})})();</script></body></html>
