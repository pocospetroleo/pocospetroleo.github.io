<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3B54"/><stop offset="1" stop-color="#151C2B"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F6B34"/><stop offset=".35" stop-color="#D9B877"/><stop offset=".55" stop-color="#FBEFCB"/><stop offset=".8" stop-color="#C9A464"/><stop offset="1" stop-color="#7E5D2B"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF5EA"/><stop offset="1" stop-color="#EEDFC4"/></linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="url(#ouro)" stroke-width="5" opacity=".55"/>
  <!-- cartão do convite saindo do envelope, com marcas de QR Code -->
  <g filter="url(#sombra)">
    <rect x="146" y="96" width="220" height="170" rx="16" fill="#FFFEFB" stroke="url(#ouro)" stroke-width="6"/>
  </g>
  <g fill="#1C2536">
    <rect x="170" y="120" width="40" height="40" rx="7"/><rect x="302" y="120" width="40" height="40" rx="7"/>
  </g>
  <g fill="#FFFEFB"><rect x="178" y="128" width="24" height="24" rx="4"/><rect x="310" y="128" width="24" height="24" rx="4"/></g>
  <g fill="#1C2536"><rect x="184" y="134" width="12" height="12" rx="2"/><rect x="316" y="134" width="12" height="12" rx="2"/>
    <rect x="226" y="122" width="12" height="12" rx="2"/><rect x="246" y="134" width="12" height="12" rx="2"/><rect x="270" y="122" width="12" height="12" rx="2"/><rect x="232" y="148" width="12" height="12" rx="2"/><rect x="262" y="150" width="12" height="12" rx="2"/></g>
  <!-- envelope -->
  <g filter="url(#sombra)">
    <path d="M96 200 Q96 184 112 184 L400 184 Q416 184 416 200 L416 392 Q416 412 396 412 L116 412 Q96 412 96 392 Z" fill="url(#env)"/>
  </g>
  <path d="M110 196 L256 306 L402 196" fill="none" stroke="url(#ouro)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 398 L206 322 M400 398 L306 322" fill="none" stroke="#D6C29C" stroke-width="7" stroke-linecap="round"/>
  <!-- selo com o "confirmado" da portaria -->
  <circle cx="256" cy="312" r="56" fill="url(#ouro)" filter="url(#sombra)"/>
  <circle cx="256" cy="312" r="45" fill="none" stroke="#FFF6DC" stroke-width="3" opacity=".8"/>
  <path d="M232 313 L250 331 L283 296" fill="none" stroke="#1C2536" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
