name: GP Control Center - monitoramento diario
on:
  push:
    paths:
      - 'gp-control-center/check.py'
      - '.github/workflows/gp-control-monitor.yml'
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gp-control-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitorar somente leitura
        run: python gp-control-center/check.py
      - name: Salvar relatorio no repositorio da central
        run: |
          git config user.name gp-control-bot
          git config user.email gp-control-bot@users.noreply.github.com
          git add gp-control-center/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar monitoramento GP Control Center [skip ci]"
            git push
          fi
